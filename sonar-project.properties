sonar.projectKey=ShadiiAM_ConcordiaCampusGuide
sonar.organization=passable-hardwood-salvage-professor-control-pedicure
sonar.host.url=https://sonarcloud.io
sonar.projectName=ConcordiaCampusGuide
sonar.sourceEncoding=UTF-8

# Source paths
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java

# Compiled class directories (standalone sonar-scanner needs these to correlate JaCoCo coverage)
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes,app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes

# JaCoCo coverage
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# JUnit test results
sonar.junit.reportPaths=app/build/test-results/testDebugUnitTest

# Exclusions
sonar.exclusions=**/R.class,**/R$*.class,**/BuildConfig.*,**/Manifest*.*,**/*Test*.*,**/databinding/**,**/ShuttleMarkerFactory.kt

sonar.coverage.exclusions=\
  **/R.class,\
  **/R$*.class,\
  **/BuildConfig.*,\
  **/*Test*.*,\
  **/ui/theme/**,\
  **/ui/components/**,\
  **/ui/screens/**,\
  **/ui/accessibility/**,\
  **/ui/map/**,\
  **/MapsActivity.kt,\
  **/MainActivity.kt,\
  **/GeoJsonOverlay.kt,\
  **/ShuttleMarkerFactory.kt,\
  **/ui/directions/**

sonar.coverage.newCode.minimumCoverage=50
